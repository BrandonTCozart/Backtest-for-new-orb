name: ES Backtest Build and Synthetic Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile backtest
        run: dotnet build "Backtest for new orb.csproj" -c Release
      - name: Run synthetic market-data and strategy regression checks (no SQL required)
        run: dotnet run --project "Backtest for new orb.csproj" -c Release --no-build -- --self-test
