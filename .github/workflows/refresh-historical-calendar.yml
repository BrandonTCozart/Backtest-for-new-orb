name: Refresh Official Historical Economic Calendar

on:
  push:
    paths:
      - scripts/build_historical_calendar.py
      - .github/workflows/refresh-historical-calendar.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-offline-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 requests
      - name: Generate static historical event dates
        run: python scripts/build_historical_calendar.py
      - name: Check-in fixed event calendar (only when changed)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Backtesting/HistoricalEconomicCalendar.g.cs
          if ! git diff --staged --quiet; then
            git commit -m 'Refresh frozen 2020-2025 release dates from official archives'
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
